[animation]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.windows_in]
enabled = true
duration_ms = 350
curve = "0.05,0.9,0.1,1"
effect = "radial-reveal"

[animation.windows_out]
enabled = true
duration_ms = 300
curve = "0.05,0.9,0.1,1"
effect = "radial-reveal"

[animation.windows_move]
enabled = true
curve = "spring:1,600"
effect = "squash"

[animation.windows_resize]
enabled = true
curve = "spring:1,1000"

[animation.windows_opacity]
enabled = true
curve = "spring:1,1000"

[animation.workspaces]
enabled = true
style = "slide"
curve = "spring:0.78,700"

[animation.overview]
enabled = true
curve = "spring:1,800"
workspace_curve = "spring:0.78,700"

[animation.scratchpad]
enabled = true
curve = "spring:1,900"
dim = 0.5
blur = true

[animation.dialogs]
enabled = true
dim = 0.3

[animation.border]
enabled = true
curve = "spring:1,1000"

[animation.dim_unfocused]
enabled = true
curve = "spring:1,1000"
dim = 0.15

[animation.layers]
enabled = true
curve = "spring:1,1000"
