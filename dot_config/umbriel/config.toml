[include]
files = [
  "effects.toml",
  "animation.toml",
  "appearance.toml",
  "binds.toml",
  "environment.toml",
  "input.toml",
  "layout.toml",
  "outputs.toml",
  "overview.toml",
  "rules.toml",
  "workspaces.toml",
]

[include.optional]
files = ["noctalia.toml"]


[general]
autostart = [
  "noctalia",
  "fcitx5",
  "wl-paste --watch cliphist store",
  "vicinae server",
  "wl-clip-persist --clipboard regular",
  "flclash",
  "qqmusic",
]

xwayland = true                   # Start Xwayland lazily for X11 applications. Changes require a restart.
xwayland_native_resolution = true # Show outputs to X11 applications at their physical resolution, so they render sharp on scaled outputs. Changes require a restart.
xwayland_xsettings = true
show_cheatsheet = false           # show keybinds overlay on startup
focus_on_activate = true          # activation requests mark urgent without stealing focus
honor_restored_maximize = true
