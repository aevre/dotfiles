# ============================================================
# 全局默认 (Global defaults)
# 无选择器的规则匹配所有窗口；必须放在最前，
# 后面的 blur = false 等规则才能覆盖它。
# ============================================================
[[window_rule]]
blur = true
blur_popups = true
blur_optimized = false

# [[window_rule]]
# match.is_focused = false
# opacity = 0.9
#
# [[window_rule]]
# match.is_focused = true
# opacity = 1.0


# ============================================================
# Noctalia 桌面壳层 (Shell)
# ============================================================
[[window_rule]]
match.app_id = "^dev\\.noctalia\\.Noctalia$"
default_floating = true
default_floating_size = { width = 0.8, height = 0.9 }
blur_popups = false

[[window_rule]]
match.app_id = "^dev\\.noctalia\\.UmbrielSharePicker$"
default_floating = true
default_floating_size = { width = 0.8, height = 0.9 }

[[window_rule]]
match.app_id = "^zen$"
blur_popups = false

# ============================================================
# 模糊 / 透明 (Blur & opacity)
# ============================================================
[[window_rule]]
match.app_id = [
  "^com\\.mitchellh\\.ghostty$",
  "^neovide$",
  "^obsidian$",
  "^org\\.gnome\\.Nautilus$",
]
blur = true

[[window_rule]]
match.app_id = ["^obsidian$", "^org\\.gnome\\.Nautilus$"]
opacity = 0.9

[[window_rule]]
match.app_id = [
  "^org\\.kde\\.kdenlive$",
  "^mpv$",
  "^kazumi$",
  "^celluloid$",
  "^virt-manager$",
]
opacity = 1.0

[[window_rule]]
match.app_id = ["^steam_app_.*$", "^gamescope$", "^wine$"]
opacity = 1.0
blur = false

[[window_rule]]
match.title = [
  "^[Gg]enshin [Ii]mpact$",
  "^[Zz]enless [Zz]one [Zz]ero$",
  "^Victoria 3$",
  "^Minecraft$",
  "^Endfield$",
]
opacity = 1.0
blur = false

# ============================================================
# 浮动工具 / 对话框 (Floating utilities & dialogs)
# ============================================================
[[window_rule]]
match.app_id = [
  "^gnome-control-center$",
  "^pavucontrol$",
  "^nm-connection-editor$",
]
default_floating_size = { width = 0.8, height = 0.9 }
default_floating = true
blur_optimized = false

[[window_rule]]
match.app_id = [
  "^org\\.gnome\\.Calculator$",
  "^gnome-calculator$",
  "^galculator$",
  "^blueman-manager$",
  "^xdg-desktop-portal$",
  "^xdg-desktop-portal-gtk$",
]
default_floating = true
blur_optimized = false
default_floating_size = { width = 0.8, height = 0.9 }

[[window_rule]]
match.app_id = "^imv$"
default_floating = true
blur_optimized = false
default_floating_size = { width = 0.8, height = 0.9 }

[[window_rule]]
match.app_id = "^nwg-look$"
match.title = "^nwg-look$"
default_floating = true
default_floating_size = { width = 0.8, height = 0.9 }

[[window_rule]]
match.title = [
  "^Open File$",
  "^Select$",
  "^Choose a wallpaper$",
  "^Open Folder$",
  "^Save As$",
  "^Library$",
  "^Choose Where to Download$",
  "^File Operation Progress$",
  "^Rename$",
  "^Copy Files$",
  "^Move Files$",
  "^Search Files$",
]
default_floating = true
blur_optimized = false
default_floating_size = { width = 0.8, height = 0.9 }

[[window_rule]]
match.app_id = "^zen$"
match.title = "^(扩展：|Extension:)"
default_floating = true
# default_position = { x = 0, y = 0 }

[[window_rule]]
match.app_id = "^org\\.localsend\\.localsend_app$"
match.title = "^LocalSend$"
default_floating = false
default_floating_size = { width = 0.3, height = 1 }


# ============================================================
# 画中画 / 媒体查看器 (Picture-in-Picture & media viewers)
# ============================================================
[[window_rule]]
match.title = "(画中画|Picture-in-Picture)"
default_floating = true
opacity = 1.0
default_floating_size = { width = 1 }
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.app_id = [
  "^org\\.gnome\\.Loupe$",
  "^org\\.gnome\\.Totem$",
  "^org\\.gnome\\.Photos$",
]
default_floating = true
default_floating_size = { width = 0.8, height = 0.9 }
opacity = 1.0

[[window_rule]]
match.title = [
  "^(图片查看器)$",
  "^(Image Viewer)$",
  "^(图片和视频)$",
  "^(Image and Video Viewer)$",
  "^(视频播放器)$",
  "^(Video Player)$",
  "^Videos$",
]
default_floating = true
default_floating_size = { width = 0.8, height = 0.9 }
opacity = 1.0

[[window_rule]]
match.app_id = "^thunar$"
match.title = "^音频信息$"
default_floating = true


[[window_rule]]
match.app_id = [
  "^(firefox.*|org\\.mozilla\\.firefox)$",
  "^(google-chrome.*|chrome|chromium.*|com\\.google\\.Chrome|org\\.chromium\\.Chromium)$",
  "^(brave.*|com\\.brave\\.Browser|microsoft-edge.*|edge|com\\.microsoft\\.Edge)$",
  "^(zen.*|app\\.zen_browser\\.zen)$",
  "^(vivaldi.*|opera.*|thorium.*|floorp.*|waterfox.*|librewolf.*)$",
  "^(org\\.gnome\\.Epiphany.*|epiphany|falkon.*|nyxt.*|qutebrowser.*|ladybird.*|midori.*|tor-browser.*)$",
]
vrr = "fullscreen"


[[window_rule]]
match.app_id = [
  "^steam_app_.*$",
  "^(gamescope|com\\.valvesoftware\\.Steam\\.Utility\\.gamescope)$",
  "^org\\.(duckstation\\.DuckStation|ppsspp\\.PPSSPP|libretro\\.RetroArch|DolphinEmu\\.dolphin-emu|citra_emu\\.citra|azahar_emu\\.Azahar|desmume\\.DeSmuME|wesnoth\\.Wesnoth)$",
  "^net\\.(pcsx2\\.PCSX2|rpcs3\\.RPCS3|shadps4\\.shadPS4|kuribo64\\.melonDS|veloren\\.veloren)$",
  "^io\\.(mgba\\.mGBA|openrct2\\.OpenRCT2|anuke\\.Mindustry)$",
  "^io\\.github\\.(simple64\\.simple64|lime3ds\\.Lime3DS|ryubing\\.Ryujinx|streetpea\\.Chiaki4deck)$",
  "^(info\\.cemu\\.Cemu|app\\.xemu\\.xemu|com\\.fightcade\\.Fightcade2|com\\.mamedev\\.MAME|com\\.wildfiregames\\.0ad|dev\\.goats\\.xivlauncher|com\\.github\\.Anuken\\.Mindustry|org\\.openmw\\.OpenMW|org\\.openttd\\.OpenTTD|org\\.cataclysmdda\\.CataclysmDDA)$",
  "^(duckstation-(qt|nogui)|pcsx2(-qt)?|rpcs3|shadps4|PPSSPP(Qt|SDL)|Vita3K|Ryujinx|suyu|sudachi|torzu|yuzu|cemu|dolphin-emu|lime3ds|citra(-qt)?|melonDS|mgba(-qt)?|simple64-gui|RMG|xemu|retroarch|mame|ggpofba|fbneo|snes9x)$",
  "^(cs2|dota2|wine)$",
  "^(com\\.moonlight_stream\\.Moonlight|moonlight|chiaki|chiaki-ng|com\\.parsecgaming\\.parsec|parsecd)$",
]
vrr = "fullscreen"
opacity = 1.0
blur = false
border_width = 0
shadow = false


[[window_rule]]
match.app_id = [
  "^((genshinimpact|yuanshen|starrail|zenlesszonezero|client-win64-shipping|wuthering waves|endfield|ffxiv_dx11|ffxiv|wow|wowclassic|league of legends|pathofexile|pathofexile_x64|pathofexile2|warframe\\.x64|r5apex|overwatch|marvelrivals|deadlock|project8)\\.exe)$",
  "^(net-minecraft-client-main-Main|Minecraft.*|factorio|RimWorldLinux|Terraria\\.bin\\.x86_64|StardewValley\\.bin\\.x86_64|Hollow_Knight\\.x86_64|deadcells|Celeste|victoria3|hoi4|ck3|stellaris|eu4|openmw|openra-(ra|cnc|d2k)|openrct2|openttd|spring|Beyond-All-Reason|mindustry|pyrogenesis|veloren-voxygen|cataclysm-tiles|wesnoth)$",
  "^((RimWorldWin64|Balatro|noita|noita_dev|Hades|Hades2|xenia|xenia_canary|Cemu)\\.exe)$",
]
vrr = "fullscreen"
opacity = 1.0
blur = false
border_width = 0
shadow = false

[[window_rule]]
match.title = [
  "^Minecraft [0-9]+\\.[0-9]+(\\.[0-9]+)?.*$",
  "^Steam Big Picture Mode$",
  "(genshin impact|Genshin Impact|zenless zone zero|Zenless Zone Zero|honkai: star rail|Honkai: Star Rail|wuthering waves|Wuthering Waves|minecraft|Minecraft|victoria 3|Victoria 3|endfield|Endfield)",
]
vrr = "fullscreen"
opacity = 1.0
blur = false
border_width = 0
shadow = false

# ============================================================
# 即时通讯 / 国产应用 (IM & local apps)
# ============================================================
[[window_rule]]
match.app_id = "^wechat$"
match.title = "^图片和视频$"
default_floating = true
opacity = 1.0
default_floating_size = { width = 0.8, height = 0.9 }
default_maximize = false

[[window_rule]]
match.app_id = "^org\\.fcitx\\.fcitx5-config-qt$"
match.title = "^Fcitx 配置$"
default_floating = true
default_maximize = false
default_floating_size = { width = 0.8, height = 0.9 }
blur_optimized = false

[[window_rule]]
match.app_id = "^QQ$"
match.title = "^QQ$"

[[window_rule]]
match.app_id = "^QQ$"
match.title = ["^(资料卡)$", "^(天气)$"]
default_focused = false
blur_optimized = false

[[window_rule]]
match.app_id = "^QQ$"
match.title = "^群聊的聊天记录$"
default_floating = true
default_floating_size = { width = 0.8, height = 0.9 }
blur_optimized = false

[[window_rule]]
match.app_id = "^qqmusic$"
match.title = "^qqmusic$"
default_maximize = false
default_scrolling_extent = 0.66667

[[window_rule]]
match.app_id = "^qqmusic$"
match.title = "^qqmusic$"
match.at_startup = true
default_maximize = false
default_scrolling_extent = 0.66667
blur_optimized = false
default_output = "ASEM S.p.A. 135TYPE-C demoset-1"
default_workspace = 1
default_scrolling_column = "qqmusic"
default_scrolling_column_order = 3

[[window_rule]]
match.app_id = "^io\\.ente\\.auth$"
default_floating = true
default_floating_size_px = { width = 532, height = 925 }
blur_optimized = false


# ============================================================
# Steam 专属 (Steam-specific)
# ============================================================
[[window_rule]]
match.app_id = "^steam$"
match.title = "^notificationtoasts_\\d+_desktop$"
default_position = { x = 10, y = 10, anchor = "bottom_right" }
default_focused = false
blur_optimized = false

[[window_rule]]
match.app_id = "^steam$"
match.title = ["^(Friends List)$", "^(好友列表)$"]
default_scrolling_extent = 0.20

# ============================================================
# 杂项应用 (Misc)
# ============================================================
[[window_rule]]
match.app_id = "^com\\.follow\\.clash$"
match.title = "^FlClash$"
default_maximize = false
opacity = 0.8
default_scrolling_extent = 0.33333
blur_optimized = false

[[window_rule]]
match.app_id = "^com\\.follow\\.clash$"
match.title = "^FlClash$"
match.at_startup = true
default_maximize = false
opacity = 0.8
default_scrolling_extent = 0.33333
blur_optimized = false
default_output = "ASEM S.p.A. 135TYPE-C demoset-1"
default_workspace = 1
default_scrolling_column = "flclash"
default_scrolling_column_order = 1

[[window_rule]]
match.app_id = "^dev\\.lemmy\\.swash$"
default_floating = true
default_floating_size_px = { width = 1000, height = 900 }
blur_optimized = false

# ============================================================
# 图层规则 (Layer rules) — 状态栏 / 通知 / 面板 / OSD 等
# ============================================================
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd)$"
blur = true
blur_ignore_alpha = 0.4
blur_optimized = false
